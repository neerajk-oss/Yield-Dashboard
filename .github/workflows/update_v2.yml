name: Daily Dashboard Update

on:
  push:
    paths:
      - 'data/dashboard_data.json'  # triggers when Apps Script pushes data
  workflow_dispatch:                 # manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python scripts/build_v2.py

      - name: Commit & push
        run: |
          git config user.email "dashboard-bot@yield"
          git config user.name "Dashboard Bot"
          git add index.html
          git diff --staged --quiet || git commit -m "Dashboard update $(date +'%Y-%m-%d %H:%M IST')"
          git push
